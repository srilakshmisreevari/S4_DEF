<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRF+ Catalog Viewer</title>
  <!-- Local test entry point (ui5 serve / Fiori tools). In the launchpad the
       app starts from Component.js and this file is not used. -->
  <script
    id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{ "zbrf.viewer": "./" }'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div
    data-sap-ui-component
    data-name="zbrf.viewer"
    data-id="container"
    data-settings='{ "id": "zbrf.viewer" }'
    style="height: 100%">
  </div>
</body>
</html>
