<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Orders</title>
  <!-- Local run only (npm start). In BTP the app is started by Work Zone. -->
  <script id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{ "zotc.schedorders": "./" }'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"></script>
  <style>html, body, body > div { height: 100%; margin: 0; }</style>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component data-name="zotc.schedorders" data-id="container"
       data-settings='{"id": "zotc.schedorders"}' data-handle-validation="true"></div>
</body>
</html>
