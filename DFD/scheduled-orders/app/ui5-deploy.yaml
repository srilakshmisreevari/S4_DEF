# Build configuration for Cloud Foundry (HTML5 Application Repository).
# Used by "npm run build:cf" from mta.yaml.
specVersion: "3.0"
metadata:
  name: zotc.schedorders
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: zotcschedorders
